name: OMNI Stage 7 - Principal and Admin APKs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omni-stage7-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-stage7-original-signature
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and verify Principal + Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited OMNI source branch
        uses: actions/checkout@v4
        with:
          repository: jmredmond262-cmyk/omni-advance-plataform-import
          ref: fix/stage-1-firestore-rules
          token: ${{ secrets.OMNI_ADVANCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Configure and validate Principal Firebase
        working-directory: source
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_JSON" || { echo "::error::No está disponible la configuración Firebase de OMNI Principal en el repositorio firmante."; exit 1; }
          printf '%s' "$FIREBASE_JSON" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = "com.aistudio.omnihub.qtzmvd"
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])]
          if expected not in packages:
              raise SystemExit("Firebase no corresponde al paquete OMNI Principal.")
          print("Firebase Principal validado.")
          PY

      - name: Configure and validate Admin Firebase
        working-directory: source
        env:
          ADMIN_FIREBASE_JSON: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_FIREBASE_JSON" || { echo "::error::No está disponible la configuración Firebase de OMNI Admin en el repositorio firmante."; exit 1; }
          printf '%s' "$ADMIN_FIREBASE_JSON" | base64 --decode > admin/google-services.json
          python3 - <<'PY'
          import json
          import os
          import xml.sax.saxutils as xml
          with open("admin/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = "com.omni.adminpanel"
          client = next((item for item in data.get("client", []) if item.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected), None)
          if client is None:
              raise SystemExit("Firebase no corresponde al paquete OMNI Admin.")
          project = data["project_info"]
          values = {
              "google_app_id": client["client_info"]["mobilesdk_app_id"],
              "google_api_key": client["api_key"][0]["current_key"],
              "project_id": project["project_id"],
              "gcm_defaultSenderId": project["project_number"],
              "google_storage_bucket": project.get("storage_bucket", "")
          }
          web_client = next((oauth["client_id"] for item in data["client"] for oauth in item.get("oauth_client", []) if oauth.get("client_type") == 3), None)
          if web_client:
              values["default_web_client_id"] = web_client
          os.makedirs("admin/src/main/res/values", exist_ok=True)
          with open("admin/src/main/res/values/firebase_config.xml", "w", encoding="utf-8") as f:
              f.write("<resources>\n")
              for key, value in values.items():
                  f.write(f'  <string name="{key}" translatable="false">{xml.escape(value)}</string>\n')
              f.write("</resources>\n")
          print("Firebase Admin validado.")
          PY

      - name: Configure optional API keys
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI_VALUE="${GEMINI_API_KEY:-NOT_CONFIGURED}"
          printf 'GEMINI_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n' "$GEMINI_VALUE" "$GOOGLE_MAPS_API_KEY" > .env

      - name: Configure and verify persistent OMNI signing key
        working-directory: source
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::No se encontró la firma persistente. Se cancela para proteger las instalaciones actuales; no se generará otra clave."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La clave no coincide con la firma original. No se generarán APKs."; exit 1; }
          echo "Firma original OMNI confirmada."

      - name: Run unit tests
        working-directory: source
        run: gradle :app:testDebugUnitTest :admin:testDebugUnitTest

      - name: Build Principal and Admin APKs
        working-directory: source
        env:
          OMNI_VERSION_CODE: "601"
          OMNI_ADMIN_VERSION_CODE: "121"
        run: gradle :app:assembleDebug :admin:assembleDebug

      - name: Verify Principal APK
        working-directory: source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.aistudio.omnihub.qtzmvd' versionCode='601' versionName='1.4.2'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/principal-certs.txt
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/principal-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          echo "Principal: paquete, versión, alineación y firma verificados."

      - name: Verify Admin APK
        working-directory: source
        run: |
          set -euo pipefail
          APK="admin/build/outputs/apk/debug/admin-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.omni.adminpanel' versionCode='121' versionName='1.4.6'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/admin-certs.txt
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/admin-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          echo "Admin: paquete, versión, alineación y firma verificados."

      - name: Upload OMNI Principal APK
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-Principal-1.4.2-code-601-original-signature
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload OMNI Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-Admin-1.4.6-code-121-original-signature
          path: source/admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 30
