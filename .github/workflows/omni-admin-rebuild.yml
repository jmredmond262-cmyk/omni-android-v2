name: OMNI Admin Rebuild

on:
  push:
    branches: ["omni-admin-rebuild"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Build installable OMNI Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Install dedicated Admin Firebase configuration
        env:
          ADMIN_FIREBASE_JSON: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
          ADMIN_AUTH_PROJECT_ID: ${{ secrets.OMNI_ADMIN_AUTH_PROJECT_ID }}
        run: |
          test -n "$ADMIN_FIREBASE_JSON" || { echo "::error::Falta OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test -n "$ADMIN_AUTH_PROJECT_ID" || { echo "::error::Falta OMNI_ADMIN_AUTH_PROJECT_ID"; exit 1; }
          printf '%s' "$ADMIN_FIREBASE_JSON" | base64 --decode > admin/google-services.json
          python3 - <<'PY'
          import json, os, sys
          with open("admin/google-services.json", encoding="utf-8") as f:
              cfg = json.load(f)
          project = cfg["project_info"]["project_id"]
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in cfg["client"]]
          if project != os.environ["ADMIN_AUTH_PROJECT_ID"]:
              raise SystemExit(f"El proyecto del google-services.json ({project}) no coincide con OMNI_ADMIN_AUTH_PROJECT_ID.")
          if "com.omni.adminpanel" not in packages:
              raise SystemExit("El archivo Firebase no contiene una app Android registrada como com.omni.adminpanel.")
          print("Configuración de autenticación administrativa validada.")
          PY
      - name: Configure persistent OMNI signing identity
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::Falta OMNI_DEBUG_KEYSTORE_BASE64. Se necesita la misma firma persistente para actualizar OMNI Admin sin desinstalar."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'
      - name: Build standalone Admin APK
        run: gradle :admin:assembleDebug
      - name: Upload OMNI Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-admin-rebuild-debug-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-source-check:
    name: Compile-check Admin Android source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Create temporary Firebase compile configuration
        run: |
          mkdir -p admin
          cat > admin/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "omni-admin-compile-check",
              "storage_bucket": "omni-admin-compile-check.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:1234567890abcdef",
                "android_client_info": { "package_name": "com.omni.adminpanel" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDUMMYCOMPILECHECKKEY000000000000000" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Compile Admin APK (not published)
        run: gradle :admin:assembleDebug
  backend:
    name: Validate secure Admin API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-package-lock
      - name: TypeScript validation
        working-directory: functions
        run: npx tsc --noEmit
