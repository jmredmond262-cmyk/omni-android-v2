name: OMNI principal + Mercado OMNI 1.4.5 - Original signing bridge

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/omni-flow-original-signature.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build OMNI 1.4.5 Mercado OMNI and verify original identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OMNI FLOW source
        uses: actions/checkout@v4
        with:
          repository: jmredmond262-cmyk/omni-advance-plataform-import
          ref: feat/omni-marketplace-demo-commerce-cycle
          token: ${{ secrets.OMNI_ADVANCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Configure and validate OMNI Firebase app
        working-directory: source
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_JSON_BASE64" || { echo "::error::No está disponible la configuración Firebase Android en el repositorio firmante."; exit 1; }
          printf '%s' "$FIREBASE_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          package = "com.aistudio.omnihub.qtzmvd"
          matches = [
              c for c in data.get("client", [])
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
          ]
          if not matches:
              raise SystemExit("La configuración Firebase no contiene el package de OMNI principal; se cancela el build.")
          print("OMNI Firebase package validated.")
          PY

      - name: Configure optional API keys
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI_VALUE="${GEMINI_API_KEY:-NOT_CONFIGURED}"
          printf 'GEMINI_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n' "$GEMINI_VALUE" "$GOOGLE_MAPS_API_KEY" > .env

      - name: Configure and validate original OMNI signing identity
        working-directory: source
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::No está disponible la clave original en el repositorio firmante. Se cancela para proteger las actualizaciones instaladas."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La identidad de firma no coincide. No se publicará ninguna APK."; exit 1; }
          echo "Original OMNI signing identity validated."

      - name: Build OMNI principal + Mercado OMNI + QR sales + OMNI Pay DEMO 1.4.5
        working-directory: source
        env:
          OMNI_VERSION_CODE: "551"
        run: gradle :app:assembleDebug

      - name: Verify OMNI package, version and original signature
        working-directory: source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "name='com.aistudio.omnihub.qtzmvd'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='551'"
          printf '%s\n' "$BADGING" | grep -F "versionName='1.4.5'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/omni-flow-certs.txt
          APK_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/omni-flow-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          test "$APK_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La APK no conserva la firma original de OMNI."; exit 1; }
          echo "OMNI package, version and original signature verified."

      - name: Upload OMNI Principal 1.4.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-principal-mercado-v1.4.5-code-551-original-signature
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# Build trigger refresh: build current reviewed branch after validating payment-gated delivery and DEMO self-consumption.
