name: Deploy OMNI Admin 1.4.5 API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, feature/build-admin-live-map-145]
    paths:
      - '.github/workflows/deploy-omni-admin-1-4-5-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: omni-admin-api-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OMNI Admin API from source branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout OMNI source with precise GPS presence
        uses: actions/checkout@v4
        with:
          repository: jmredmond262-cmyk/omni-advance-plataform-import
          ref: feature/omni-admin-live-map-1.4.3-correct-base
          path: source
          token: ${{ secrets.OMNI_ADVANCE_READ_TOKEN }}

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          SOURCE_READ_TOKEN: ${{ secrets.OMNI_ADVANCE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_READ_TOKEN" || { echo "::error::Falta OMNI_ADVANCE_READ_TOKEN"; exit 1; }
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Falta OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64"; exit 1; }
          test -f source/workers/wrangler.toml || { echo "::error::No se encontró el wrangler.toml de OMNI Admin"; exit 1; }
          test -f source/workers/src/index.js || { echo "::error::No se encontró el Worker de OMNI Admin"; exit 1; }
          echo "Credenciales y archivos de despliegue verificados."

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config source/workers/wrangler.toml

      - name: Set primary Firebase service credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_BASE64: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --name omni-admin-api --config source/workers/wrangler.toml
