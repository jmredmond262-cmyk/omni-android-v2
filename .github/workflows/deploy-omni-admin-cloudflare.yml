name: Deploy OMNI Admin API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [omni-admin-rebuild]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-omni-admin-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure OMNI Admin API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OMNI Admin branch
        uses: actions/checkout@v4
        with:
          ref: omni-admin-rebuild

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Falta OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64"; exit 1; }
          echo "Credenciales requeridas presentes."

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/wrangler.toml

      - name: Set primary Firebase service credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_BASE64: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --name omni-admin-api --config workers/wrangler.toml

  deploy-firestore-rules:
    name: Publish OMNI Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OMNI source
        uses: actions/checkout@v4
        with:
          ref: omni-admin-rebuild
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate and publish Firestore rules
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          test -n "$SERVICE_ACCOUNT_BASE64" || { echo "::error::Falta OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64"; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/omni-firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/omni-firebase-service-account.json"
          firebase deploy --only firestore:rules --project omni-57f69 --non-interactive
