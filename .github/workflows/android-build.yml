name: OMNI Android Build 1.4
# Includes user profile sync and product analytics from the admin rebuild branch.

on:
  push:
    branches: [ "main", "omni-resto-mejoras", "omni-admin-app", "omni-admin-rebuild", "omni-v1.3-release-candidate", "omni-v1.3-integral", "omni-v1.4-integral" ]
  pull_request:
    branches: [ "main", "omni-resto-mejoras", "omni-v1.3-release-candidate", "omni-v1.3-integral", "omni-v1.4-integral" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OMNI debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Configure Firebase Android apps
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          ADMIN_FIREBASE_JSON: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ] && [ -n "$ADMIN_FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            printf '%s' "$ADMIN_FIREBASE_JSON" | base64 --decode > admin/google-services.json
            python3 - <<'PY'
          import json
          import os
          import xml.sax.saxutils as xml
          
          with open("admin/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          client = next(
              item for item in data["client"]
              if item["client_info"]["android_client_info"]["package_name"] == "com.omni.adminpanel"
          )
          project = data["project_info"]
          values = {
              "google_app_id": client["client_info"]["mobilesdk_app_id"],
              "google_api_key": client["api_key"][0]["current_key"],
              "project_id": project["project_id"],
              "gcm_defaultSenderId": project["project_number"],
              "google_storage_bucket": project.get("storage_bucket", ""),
          }
          web_client = next(
              (oauth["client_id"] for item in data["client"]
               for oauth in item.get("oauth_client", [])
               if oauth.get("client_type") == 3),
              None
          )
          if web_client:
              values["default_web_client_id"] = web_client
          os.makedirs("admin/src/main/res/values", exist_ok=True)
          with open("admin/src/main/res/values/firebase_config.xml", "w", encoding="utf-8") as f:
              f.write("<resources>\n")
              for key, value in values.items():
                  f.write(f'  <string name="{key}" translatable="false">{xml.escape(value)}</string>\n')
              f.write("</resources>\n")
          PY
            echo "Firebase project resources configured for OMNI Admin."
          else
            echo "::error::Faltan las configuraciones Firebase de OMNI o de OMNI Admin. Se cancela la compilación para no publicar APK sin conexión funcional."
            exit 1
          fi
      - name: Configure optional API keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          GEMINI_VALUE="${GEMINI_API_KEY:-NOT_CONFIGURED}"
          printf 'GEMINI_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n' "$GEMINI_VALUE" "$GOOGLE_MAPS_API_KEY" > .env
      - name: Configure persistent OMNI signing identity
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::Falta OMNI_DEBUG_KEYSTORE_BASE64. Se cancela la publicación para proteger las actualizaciones existentes."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La firma de OMNI cambió. Se cancela la publicación para proteger las instalaciones existentes."; exit 1; }
          echo "Firma persistente validada: $ACTUAL_SHA256"
      - name: Build OMNI APK
        env:
          OMNI_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug
      - name: Verify OMNI package, version and APK signing identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.aistudio.omnihub.qtzmvd' versionCode='$GITHUB_RUN_NUMBER' versionName='1.4.0'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/omni-apk-certs.txt
          APK_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/omni-apk-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          test "$APK_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La APK de OMNI no conserva la firma autorizada."; cat /tmp/omni-apk-certs.txt; exit 1; }
          echo "APK OMNI verificada: paquete, versión y firma correctos."
      - name: Upload OMNI APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-v1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Build OMNI Admin APK
        env:
          OMNI_ADMIN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :admin:assembleDebug
      - name: Upload OMNI Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-admin-debug-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 90
